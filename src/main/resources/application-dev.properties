# Development (local runs). The default profile when none is given.
# ./secrets-dev.properties is REQUIRED: it must point at the dev database, so a
# local run can never touch the production WarshaDB by accident.
# Template: secrets-dev.properties.example
spring.config.import=file:./secrets-dev.properties

# Every email (order notifications, OTPs, customer updates) goes here instead
# of its real recipient, so testing never mails the shop owner or customers.
app.mail.orders-inbox=ekhalaf990@gmail.com
app.mail.redirect-all-to=ekhalaf990@gmail.com

image.upload.dir=./warsha-images/

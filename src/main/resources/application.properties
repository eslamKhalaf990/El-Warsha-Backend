spring.application.name=erp

# Secrets (DB, mail, Google, JWT) are NOT stored in git. They are loaded from
# ./secrets.properties next to the running jar, or from environment variables
# (e.g. SPRING_DATASOURCE_PASSWORD, JWT_SECRET). See secrets.properties.example.
spring.config.import=optional:file:./secrets.properties

# DEPLOYED DATABASE

# ON-SERVER DATABASE (when the app runs on the server host itself)
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WarshaDB;encrypt=true;trustServerCertificate=true;


# gmail for sending emails
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none

# logs for debugging
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR

# server port
server.port=${PORT:8080}

# Maximum file size for a single file
spring.servlet.multipart.max-file-size=15MB

# Maximum request size (all files + form data)
spring.servlet.multipart.max-request-size=15MB

# Ignoring auto naming columns
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

# LOCAL DATABASE
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=WarshaERP;trustServerCertificate=true

# google oauth for drive images
google.client.id=881242863381-rubnpv9csakd68e5hgt30bll7om5fbde.apps.googleusercontent.com
google.drive.folder.id=1PCfi0vdmcArMoXKRjgNL4lPNq3WnnSkL
google.application.name=WarshaBackend


# folder holding product images, served at /images/<filename>
image.upload.dir=/root/warsha_images/

# Logging: every line carries the request id set by RequestIdFilter
logging.pattern.level=%5p [%X{requestId:-}]
logging.level.com.warsha.erp=INFO
